<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>合同模板插入订购单</title>                
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hyperformula/dist/hyperformula.full.min.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1 class="title">合同模板插入订购单</h1>
      
      </header>

      <section class="panel">
        <div class="grid">
          <div class="card">
            <div class="cardTitle">1) 合同模板</div>
            <div class="row">
              <label class="label" for="templateSelect">选择模板：</label>
              <select id="templateSelect" class="select">
                <option value="">正在加载模板...</option>
              </select>
            </div>
            <div class="row">
              <label class="label" for="templateSheet">工作表：</label>
              <select id="templateSheet" class="select" disabled></select>
            </div>
            <div id="templateInfo" class="meta"></div>
          </div>

          <div class="card">
            <div class="cardTitle">2) 订购单</div>
            <div class="row">
              <label class="label" for="purchaseFile">上传订购单：</label>
              <input id="purchaseFile" class="file" type="file" accept=".xlsx,.xls" />
            </div>
            <div class="row">
              <label class="label" for="purchaseSheet">工作表：</label>
              <select id="purchaseSheet" class="select" disabled></select>
            </div>
            <div id="purchaseInfo" class="meta"></div>
          </div>
        </div>

        <div class="actions">
          <button id="mergeBtn" class="btn primary" disabled>生成并预览</button>
          <button id="downloadBtn" class="btn" disabled>下载修改后文件</button>
          <button id="saveBtn" class="btn" disabled>保存到合同列表</button>
          <span id="status" class="status"></span>
        </div>
      </section>

      <section class="panel">
        <div class="panelTitle">预览</div>
        <div class="previewHint">
          <span>可在此直接修改模板或生成后的内容。预览仅展示前 60 行与前 20 列。</span>
          <span class="editBadge">支持点击单元格直接修改内容</span>
        </div>
        <div class="nameRow">
          <label class="label" for="saveName">保存文件名：</label>
          <input id="saveName" class="input" type="text" placeholder="生成后会自动填充默认命名" disabled />
        </div>
        <div id="preview" class="preview"></div>
      </section>

      <section class="panel">
        <div class="panelTitle">已保存 - 合同列表</div>
        <div class="listWrap">
          <table class="listTable">
            <thead>
              <tr>
                <th class="colIndex">序号</th>
                <th>名称</th>
                <th class="colTime">上传时间</th>
                <th class="colOps">操作</th>
              </tr>
            </thead>
            <tbody id="contractsTbody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="previewModal" class="modalOverlay" aria-hidden="true">
      <div class="modal">
        <div class="modalHeader">
          <div id="modalTitle" class="modalTitle">预览</div>
          <select id="modalSheetSelect" class="modalSelect"></select>
          <button id="modalClose" class="modalClose" type="button">×</button>
        </div>
        <div class="modalBody">
          <div id="modalPreview" class="preview modalPreview"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
